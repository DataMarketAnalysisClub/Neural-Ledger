# `docker compose up` must work from a clean checkout with NO API keys (offline mode).
# Copy .env.example to .env to switch to live mode (real LLM, Jev, SQLite).
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    # Container-only settings are fixed here, not read from .env: they override env_file, so copying
    # .env.example (where NL_PERSISTENCE=memory suits local runs) cannot make the container forget its
    # audit log and sandbox bank on restart.
    # NL_AUTH is fixed for the same reason: the deployed API identifies users by session cookie only, so a
    # copied .env.example (NL_AUTH=demo, for local runs) cannot reopen the X-User-Id header. Set NL_APP_ORIGINS
    # in .env to the public URL when the UI is served from anywhere but http://localhost:3000.
    environment:
      NL_AUTH: accounts
      NL_PERSISTENCE: sqlite
      NL_SQLITE_PATH: /app/var/neural_ledger.db
      NL_DATA_DIR: /app/data
      NL_CONTRACTS_DIR: /app/contracts
    ports:
      - "8000:8000"
    volumes:
      - ledger-data:/app/var

  # The UI never computes money: it renders facts returned by the API (proxied at /api by nginx).
  web:
    build:
      context: ./web
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  ledger-data:
