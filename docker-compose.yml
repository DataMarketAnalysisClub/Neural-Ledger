# `docker compose up` must work from a clean checkout with NO API keys (offline mode).
# Copy .env.example to .env to switch to live mode (real LLM, Jev, SQLite).
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      NL_PERSISTENCE: ${NL_PERSISTENCE:-sqlite}
      NL_SQLITE_PATH: /app/var/neural_ledger.db
    ports:
      - "8000:8000"
    volumes:
      - ledger-data:/app/var

  # The UI never computes money: it renders facts returned by the API (proxied at /api by nginx).
  web:
    build:
      context: ./web
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  ledger-data:
