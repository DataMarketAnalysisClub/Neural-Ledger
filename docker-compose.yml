# `docker compose up` must work from a clean checkout with NO API keys (offline mode).
# Copy .env.example to .env to switch to live mode (real LLM, Jev, SQLite).
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    # Container-only settings are fixed here, not read from .env: they override env_file, so copying
    # .env.example (where NL_PERSISTENCE=memory suits local runs) cannot make the container forget its
    # audit log and sandbox bank on restart.
    environment:
      NL_PERSISTENCE: sqlite
      NL_SQLITE_PATH: /app/var/neural_ledger.db
      NL_DATA_DIR: /app/data
      NL_CONTRACTS_DIR: /app/contracts
    ports:
      - "8000:8000"
    volumes:
      - ledger-data:/app/var

  # web:
  #   Role D adds the frontend here (build ./web, port 3000), talking to http://api:8000.
  #   The UI never computes money: it renders facts returned by the API.

volumes:
  ledger-data:
