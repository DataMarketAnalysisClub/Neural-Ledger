[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-ledger"
version = "0.1.0"
description = "AI cash-flow copilot with deterministic authority (FinTechathon 2026, Topic A)"
readme = "README.md"
requires-python = ">=3.12"
# The core (domain + application) has zero runtime dependencies on purpose.
# Frameworks and providers are optional extras used only by adapters.
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# pymupdf (AGPL-3.0) is only for tests, which draw synthetic statements with it, and for rasterizing scans in `ocr`.
dev = ["pytest>=8", "jsonschema>=4.21", "httpx>=0.27", "ruff>=0.6", "hypothesis>=6.100", "pymupdf>=1.24"]
# Bank statement import: `pdf` reads text-layer PDFs (the Docker image ships it); `ocr` adds pymupdf to rasterize
# scans and easyocr (+ torch, install the CPU wheel first) to read them. Keep AGPL code out of `pdf` and the image.
pdf = ["pdfplumber>=0.11"]
ocr = ["neural-ledger[pdf]", "pymupdf>=1.24", "Pillow>=10", "numpy>=1.26", "easyocr>=1.7"]
# Spending categories for imported statement lines (naive Bayes, trained at first use from package data).
ml = ["scikit-learn>=1.4"]

[project.scripts]
neural-ledger = "neural_ledger.bootstrap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"neural_ledger.adapters.outbound.classifier" = ["training/*.csv"]

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "I"]
# B008: FastAPI's Body()/Query() defaults are idiomatic. UP042: (str, Enum) is deliberate and JSON-friendly.
ignore = ["B008", "B905", "UP017", "UP042", "UP046", "UP047", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["neural_ledger", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# Fast default: property tests (hypothesis) are deselected. `-m property` selects only them and
# `-m ""` (make test-all) runs everything; a later -m on the command line overrides this one.
addopts = "-q -m 'not property'"
xfail_strict = true
markers = [
    "golden: expected answers from the Financial Core calibration (E01-E14)",
    "security: security suite S01-S12",
    "property: hypothesis property tests (slow); excluded by default, run with make test-all",
]
