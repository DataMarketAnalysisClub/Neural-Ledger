[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-ledger"
version = "0.1.0"
description = "AI cash-flow copilot with deterministic authority (FinTechathon 2026, Topic A)"
readme = "../README.md"
requires-python = ">=3.12"
# The core (domain + application) has zero runtime dependencies on purpose.
# Frameworks and providers are optional extras used only by adapters.
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8", "jsonschema>=4.21", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
neural-ledger = "neural_ledger.bootstrap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["F", "E9", "B", "UP", "I"]
# B008: FastAPI's Body()/Query() defaults are idiomatic. UP042: (str, Enum) is deliberate and JSON-friendly.
ignore = ["B008", "B905", "UP017", "UP042", "UP046", "UP047", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["neural_ledger", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
xfail_strict = true
markers = [
    "golden: expected answers from the Financial Core calibration (E01-E14)",
    "security: security suite S01-S12",
]
