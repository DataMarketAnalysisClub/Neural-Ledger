# Public demo deployment on nixbox (docs/runbooks/DEPLOY.md). Server layout:
#   /opt/neural-ledger/app     the deployed commit (git archive), the Compose project directory
#   /opt/neural-ledger/deploy  this file, nginx.deploy.conf, .env.tunnel and compose.env (mode 600, never committed)
#   /opt/neural-ledger/secrets nl_data_key, the Docker secret of docker-compose.data-key.yml
#   cd /opt/neural-ledger && docker compose -p neural-ledger --env-file deploy/compose.env -f app/docker-compose.yml \
#     -f app/docker-compose.data-key.yml -f deploy/docker-compose.deploy.yml up -d --build
# Relative paths resolve from the project directory (app/), hence ../deploy/.
# No host port is published: Cloudflare edge (TLS) -> cloudflared -> web:3000 -> api:8000. Offline mode only.
services:
  api:
    # OCR for photos (EasyOCR on CPU torch, weights in the image, no pymupdf): see deploy/api-ocr.Dockerfile.
    build:
      dockerfile: ../deploy/api-ocr.Dockerfile
      args:
        EXTRAS: api,pdf,ml,receipts
    environment:
      # Here and not in app/.env: an empty NL_OCR_MODEL_DIR= copied from .env.example would point at ~/.EasyOCR.
      NL_OCR_MODEL_DIR: /app/models/easyocr
    ports: !reset []
    restart: unless-stopped

  web:
    ports: !reset []
    restart: unless-stopped
    volumes:
      - ../deploy/nginx.deploy.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Remotely managed tunnel "neural-ledger": ingress neural-ledger.dmac.cl -> http://web:3000, else 404.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    command: ["tunnel", "--no-autoupdate", "run"]
    # TUNNEL_TOKEN only. The api reads app/.env, so the token never goes there.
    env_file: ../deploy/.env.tunnel
    depends_on: [web]
    restart: unless-stopped
