# Public demo deployment on nixbox (docs/runbooks/DEPLOY.md). Server layout:
#   /opt/neural-ledger/app     the deployed commit (git archive), the Compose project directory
#   /opt/neural-ledger/deploy  this file, nginx.deploy.conf and .env.tunnel (mode 600, never committed)
#   cd /opt/neural-ledger && docker compose -p neural-ledger -f app/docker-compose.yml -f deploy/docker-compose.deploy.yml up -d --build
# Relative paths resolve from the project directory (app/), hence ../deploy/.
# No host port is published: Cloudflare edge (TLS) -> cloudflared -> web:3000 -> api:8000. Offline mode only.
services:
  api:
    ports: !reset []
    restart: unless-stopped

  web:
    ports: !reset []
    restart: unless-stopped
    volumes:
      - ../deploy/nginx.deploy.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Remotely managed tunnel "neural-ledger": ingress neural-ledger.dmac.cl -> http://web:3000, else 404.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.1
    command: ["tunnel", "--no-autoupdate", "run"]
    # TUNNEL_TOKEN only. The api reads app/.env, so the token never goes there.
    env_file: ../deploy/.env.tunnel
    depends_on: [web]
    restart: unless-stopped
