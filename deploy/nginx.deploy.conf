# Public demo deployment: web/nginx.conf plus HTTPS redirect, security headers and the visitor's IP from
# Cloudflare. Mounted over /etc/nginx/conf.d/default.conf by deploy/docker-compose.deploy.yml. Keep the
# locations in sync with web/nginx.conf (docs/runbooks/DEPLOY.md).
server {
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;

  # No host port is published: only cloudflared, on the Compose network, reaches this server. Its
  # CF-Connecting-IP is the visitor's address and becomes $remote_addr.
  set_real_ip_from 172.16.0.0/12;
  real_ip_header CF-Connecting-IP;

  # Cloudflare sends the visitor's scheme. Requests without it (the container healthcheck) are not redirected.
  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  # add_header in a location drops the server-level ones, so every location repeats the security headers.

  # The UI calls /api/...; the backend serves at the root, so strip the prefix.
  location /api/ {
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    # The API sends its own nosniff; drop it so the header is not repeated.
    proxy_hide_header X-Content-Type-Options;

    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-User-Id $http_x_user_id;
    # Replace, never append: the API's per-IP rate limit must see the visitor's address, not one the client typed.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    # TLS ends at the Cloudflare edge, and plain http was redirected above.
    proxy_set_header X-Forwarded-Proto https;
    # Statement files go up to 15 MB and the API answers the limit itself; OCR of a scan can take minutes.
    client_max_body_size 16m;
    proxy_read_timeout 300s;
  }

  # Hashed assets can be cached for long; index.html never.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
  }

  # Client-side routes fall back to the app shell.
  location / {
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    try_files $uri /index.html;
  }
}
